<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review - Word Vault</title>
    <style>
        :root {
            --bg: #FAFAF8;
            --ink: #1C1C1A;
            --ink-soft: #45453F;
            --muted: #8B8B85;
            --accent: #4A5D52;
            --accent-dark: #3B4B42;
        }

        * {
            box-sizing: border-box;
        }

        /* Without this, "hidden" can be overridden by display rules below */
        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            padding: 24px 32px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 24px 96px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .word {
            margin: 0 0 6px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 6vw, 46px);
            font-weight: 400;
            line-height: 1.15;
            text-transform: capitalize;
        }

        .pos {
            margin: 0 0 22px;
            font-size: 14px;
            font-style: italic;
            color: var(--muted);
        }

        .definition {
            max-width: 46ch;
            margin: 0 auto 40px;
            font-size: clamp(18px, 3vw, 21px);
            line-height: 1.6;
            color: var(--ink-soft);
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover {
            background: var(--accent-dark);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .answer-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-quiet {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid #D9D8D0;
        }

        .btn-quiet:hover {
            background: #EFEEE8;
        }

        .empty-title {
            margin: 0 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 26px;
            font-weight: 400;
        }

        .empty-text {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: var(--muted);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <header>Word Vault</header>

    <main>

        <!-- Shown when there are no saved words -->
        <section class="card" id="empty" hidden>
            <h1 class="empty-title">No words to review yet</h1>
            <p class="empty-text">Search a word's meaning on Google and it will show up here.</p>
        </section>

        <!-- The quiz card: question first, answer after "Show answer" -->
        <section class="card" id="card">
            <h1 class="word" id="word">Extravagant</h1>
            <p class="pos" id="pos">adjective</p>
            <p class="definition" id="definition" hidden>Exceeding the bounds of something; roving; hence, foreign.</p>

            <button class="btn" id="show-btn" type="button">Show answer</button>
            <div class="answer-btns" id="answer-btns" hidden>
                <button class="btn btn-quiet" id="wrong-btn" type="button">Didn't know it</button>
                <button class="btn" id="right-btn" type="button">Knew it</button>
            </div>
        </section>

    </main>

    <script src="review.js"></script>
</body>

</html>
