<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  body {
    width: 360px;
    max-height: 480px;
    overflow-y: auto;
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #FAFAF8;
    color: #1C1C1A;
  }
  h3 {
    font-size: 13px;
    font-weight: 600;
    color: #8B8B85;
    letter-spacing: 0.02em;
    margin: 0 0 18px 0;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 16px 0;
    border-bottom: 1px solid #E8E7E1;
  }
  li:first-child { padding-top: 0; }
  li:last-child { border-bottom: none; }
  .word-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .word {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    text-transform: capitalize;
    color: #1C1C1A;
    margin-bottom: 3px;
  }
  .pos {
    font-size: 12px;
    font-style: italic;
    color: #8B8B85;
    margin-bottom: 6px;
  }
  .def {
    font-size: 13px;
    line-height: 1.5;
    color: #45453F;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #C9C8C0;
    cursor: pointer;
    font-size: 15px;
    padding: 2px 4px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  li:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { color: #4A5D52; }
  .empty {
    font-size: 13px;
    color: #8B8B85;
    padding: 20px 0;
  }
</style>
</head>
<body>
  <h3>Saved words</h3>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
